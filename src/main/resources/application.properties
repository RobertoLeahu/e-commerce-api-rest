# =====================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS EN MEMORIA (H2)
# =====================================================================

# Habilita la consola web de H2 para visualizar las tablas e insertar/consultar datos manualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL de conexión persistente en memoria mientras el proceso esté activo
# spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# =====================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL)
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=ecommerce_user
spring.datasource.password=ecommerce_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =====================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE (H2)
# =====================================================================
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' genera o actualiza el esquema automáticamente sin borrar los datos al reiniciar
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACIÓN DE JPA / HIBERNATE (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'create-drop' destruye y recrea el esquema en cada arranque/apagado del servidor
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# INICIALIZACIÓN DE SCRIPTS SQL (data.sql / schema.sql) (H2)
# =====================================================================
# Se desactiva para evitar errores de clave duplicada ('unique constraint') en arranques sucesivos
# spring.sql.init.mode=never
# spring.jpa.defer-datasource-initialization=false

# INICIALIZACIÓN DE SCRIPTS SQL (data.sql / schema.sql) (PostgreSQL)
# 'always' fuerza la ejecución del archivo data.sql en cada inicio
spring.sql.init.mode=always
# 'true' asegura que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

